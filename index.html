<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarık Bana Bas</title>
    <style>
        * { box-sizing: border-box; }

        #floater {
    position: fixed;
    top: 0;
    left: 0;
    width: 220px;
    border-radius: 16px;
    z-index: 0;            /* behind the menu */
    pointer-events: none;  /* clicks go straight through it */
}
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Put your background image next to this file and name it background.jpg.
               The gradient shows if the image is missing. */
            background: url('background.png') center / cover repeat-y,
                        linear-gradient(135deg, #ffd1e8, #d7c4ff, #bfeaff);
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            text-align: center;
            position: relative;
            z-index: 1; 
        }

        #floater {
    position: fixed;
    top: 0;
    left: 0;
    width: 150px;
    border-radius: 16px;
    z-index: 0;
    pointer-events: none;
}

@media (max-width: 600px) {
    #floater { width: 100px; }
}

        .vibrant-colors {
    display: inline-block;
    font-size: 36px;
    margin: 0 0 10px;
    color: #CEA0E8;

        }

        .transparent-box {
            background: rgba(255, 255, 255, 0.55);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
        }

        .letter-content {
            font-family: 'Georgia', serif;
            font-size: 17px;
            line-height: 1.5;
            color: #333;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .nefes-text {
            background: url('nefesin.png') center / cover no-repeat;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px 20px;
            border-radius: 8px;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .nefes-text p {
            margin: 0.5em 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .menu a {
            display: block;
            padding: 24px;
            background-image: url('8bit.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-family: 'Georgia', serif;
            font-size: 19px;
            width: 100%;
            min-width: 200px;
        }

        .menu a:hover,
        .menu a:focus-visible {
            opacity: 0.8;
        }

        .menu small {
            display: block;
            margin-top: 6px;
            font-size: 13px;
            opacity: 0.85;
        }

        .menu a:nth-child(1) {
            order: 2;
        }

        .menu a:nth-child(2) {
            order: 1;
        }

        .menu a:nth-child(3) {
            grid-column: 1 / -1;
            order: 3;
            margin: 0 auto;
            width: 100%;
            max-width: 200px;
        }

        @media (prefers-reduced-motion: reduce) {
            .vibrant-colors { animation: none; color: #CEA0E8; }
        }
    </style>
</head>
<body>
    <img id="floater" src="pony.png" alt="" aria-hidden="true">
    <div class="container">
        <h1 class="vibrant-colors">Selam Aşkımmm</h1>

        <div class="transparent-box">
            <div class="letter-content">
                <div class="nefes-text">
                    <p>Nefesini bir ömür tenimde hissetmek istiyorum</p>
                    <p>I love being your slut</p>
                </div>
            </div>

            <nav class="menu">
                <a href="perfumes.html">Parfüm oyunu oyna<small>O mu bu mu</small></a>
                <a href="blackjack.html">Blackjack oyna<small>Beat the dealer</small></a>
                <a href="fortune.html">Fal bak<small>geleceğini gör</small></a>
            </nav>
        </div>
    </div>
    <script>
    const floater = document.getElementById('floater');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function startFloating() {
        let x = Math.random() * Math.max(0, window.innerWidth - floater.offsetWidth);
        let y = Math.random() * Math.max(0, window.innerHeight - floater.offsetHeight);
        const speed = 150;                       // pixels per second, raise for faster
        const angle = Math.random() * 2 * Math.PI;
        let vx = Math.cos(angle) * speed;
        let vy = Math.sin(angle) * speed;
        let last = performance.now();

        function move(now) {
            const dt = (now - last) / 1000;     // keeps speed the same on any screen
            last = now;

            const maxX = Math.max(0, window.innerWidth - floater.offsetWidth);
            const maxY = Math.max(0, window.innerHeight - floater.offsetHeight);

            x += vx * dt;
            y += vy * dt;

            if (x <= 0)    { x = 0;    vx =  Math.abs(vx); }
            if (x >= maxX) { x = maxX; vx = -Math.abs(vx); }
            if (y <= 0)    { y = 0;    vy =  Math.abs(vy); }
            if (y >= maxY) { y = maxY; vy = -Math.abs(vy); }

            floater.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
            requestAnimationFrame(move);
        }

        floater.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
        if (!reduceMotion) requestAnimationFrame(move);
    }

    if (floater.complete) startFloating();
    else floater.addEventListener('load', startFloating);
</script>
</body>
</html>
