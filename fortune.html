<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadııı</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('bireylulaksami.png') center / cover repeat-y,
                        linear-gradient(135deg, #2b1055, #5b2a86, #1b1038);
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h1 { font-size: 36px; margin: 0 0 10px; color: #6F1ED9; letter-spacing: 2px; }

        .transparent-box {
            background: rgba(28, 10, 48, 0.78);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e6c36a;
            color: #f3e9ff;
        }

        label { display: block; margin-bottom: 8px; font-size: 18px; }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #e6c36a;
            background: #fff;
            color: #222;
            font-family: inherit;
            font-size: 16px;
            margin-bottom: 12px;
        }

        button {
            padding: 10px 20px;
            background-color: #e6c36a;
            color: #2a1245;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover { background-color: #f1d58f; }
        button.secondary { background-color: transparent; color: #e6c36a; border: 1px solid #e6c36a; }
        button.secondary:hover { background-color: rgba(230, 195, 106, 0.15); }

        #status { min-height: 22px; margin: 10px 0 0; color: #ffb4b4; }

        #reading { margin-top: 16px; text-align: left; }

        .opening { font-size: 19px; text-align: center; margin: 0 0 16px; }

        .spread { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }

        .slot {
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .slot.show { opacity: 1; transform: none; }

        .position { text-align: center; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #e6c36a; margin-bottom: 6px; }

        .tcard {
            height: 150px;
            border: 2px solid #e6c36a;
            border-radius: 10px;
            background: radial-gradient(circle at 50% 40%, #5b2a86, #2a1245);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .tcard .symbol { font-size: 48px; line-height: 1; }
        .tcard.reversed .symbol { transform: rotate(180deg); }
        .tcard .cname { font-weight: bold; color: #e6c36a; }
        .tcard .rev { font-size: 12px; color: #d9c6f0; min-height: 14px; }

        .slot p { margin: 0; font-size: 15px; line-height: 1.5; }

        .ending { margin-top: 18px; text-align: center; opacity: 0; transition: opacity 0.8s ease; }
        .ending.show { opacity: 1; }
        .ending p { margin: 8px 0; }
        .ending .closing { color: #e6c36a; font-style: italic; }

        @media (prefers-reduced-motion: reduce) {
            .slot, .ending { transition: none; transform: none; }
        }

        .back-link { display: inline-block; margin-top: 16px; color: #e6c36a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fala inanma falsız kalma</h1>
        <div class="transparent-box">
            <form id="askForm">
                <label for="question">Merak ettiğin sorunu sor</label>
                <input type="text" id="question" maxlength="200" autocomplete="off" placeholder="Elif cinsiyet değiştirecek mi?">
                <button type="submit">Cevabını öğren</button>
                <button type="button" id="againBtn" class="secondary" hidden>Ask another question</button>
            </form>
            <p id="status" aria-live="polite"></p>
            <div id="reading" aria-live="polite"></div>
            <a class="back-link" href="index.html">← Ana sayfaya dön</a>
        </div>
    </div>

    <script>
        // ===== PART 1: TOPICS =====

        const TOPICS = {

            money:     ['money', 'rich', 'salary', 'buy', 'debt', 'afford', 'save', 'invest', 'pay', 'wealth', 'finance', 'para', 'param', 'parası', 'zengin', 'maaş', 'maaşım', 'prim'],
            education: ['study', 'school', 'exam', 'university', 'abroad', 'degree', 'college', 'learn', 'grade', 'course', 'scholarship', 'master', 'graduate', 'okuyacak', 'okumak', 'almanya', 'ingiltere'],
            career:    ['job', 'work', 'promotion', 'interview', 'boss', 'career', 'business', 'hire', 'resign', 'quit', 'company', 'iş', 'çalışacak', 'çalış']
        };

        // Used in the opening line of non yes/no questions.
        const TOPIC_NAMES = {
            love: 'matters of the heart',
            money: 'money and security',
            education: 'your studies',
            career: 'your work',
            general: 'what is on your mind'
        };

        // ===== PART 2: CARDS =====
        // tone: 1 = good, 0 = mixed, -1 = difficult.
        // Add a line per topic when the card has something clear to say.
        // 'general' is the fallback for any question, so keep it abstract.
        const CARDS = {
            fool: {
                name: 'The Fool', symbol: '🌿', tone: 1,
                love: 'Yeni bir başlangıç, kalbini açık tut. Garanti yok sadece kalbini yeniliklere açık tut.',
                money: 'Yeni şeylere bir bakış. Çok dikkatli ol.',
                education: 'Yepyeni bir yol açılıyor, her şeye çoktan karar vermiş olmana gerek yok.',
                career: 'Merakının tecrübenden daha önemli olduğu bir başlangıç.',
                general: 'Yeni bir başlangıç seni çağırıyor, cesaretli bir adım mükemmel bir plandan daha önemli.',
                reversed: 'Endişe edebilirsin veya fevri karar verebilirsin. Hareket etmeden önce dur ve biraz düşün.'
            },
            magician: {
                name: 'The Magician', symbol: '✨', tone: 1,
                love: 'Bu bağlantıyı gerçek kılmak için gereken her şeye sahipsin. İçinden geçeni söyle.',
                money: 'Eğer üzerinde çalışırsan yeteneklerin gelir kapısı olabilirler.',
                education: 'Başarılı olman için gereken araçlara zaten sahipsin.',
                career: 'Yeteneklerin fark ediliyor. Yapabileceklerini göstermenin tam zamanı.',
                general: 'Bu konuda düşündüğünden daha çok gücün var. Sakın exine mesaj atma',
                reversed: 'Enerjin çok fazla yöne dağılmış. Enerji enerji azcık da sinerji'
            },
            lovers: {
                name: 'The Lovers', symbol: '💞', tone: 1,
                love: 'Masallardaki gibi bir aşk, Elif ve Tarığın aşkı gibi bir aşk',
                money: 'Sevdiğin insanlara bağış yapacaksın',
                education: 'Sevdiğin bölümde okuyacaksın',
                career: 'Ormanda bulduğun mavi renkli kurbağaya sakın dokunma.',
                general: 'Sana büyü yapmaya kalkanlar olacak, dön ve onlara avada kedavra yap',
                reversed: 'Sevgiline at almazsan ayrılabilirsiniz (kesin değil)',
            },
            chariot: {
                name: 'The Chariot', symbol: '🛡️', tone: 1,
                love: 'Yıl olmuş 2026 chariot mı kaldı',
                money: 'Bir gelin arabasının önünü keseceksin ve aldığın zarftan bin tl çıkacak',
                education: 'Hayallerini kurduğun eğitimi alacaksın ama yurt dışına otobüsle gidebilirsin',
                career: 'İş yerine yeni bir araba alabilirler',
                general: 'Sabreeeet sabret inci tanemmm bekleee benii döneceğim mutlaka sabreeett.',
                reversed: 'Yolunu kaybedersen ihtiyacın olan şey navigasyondur'
            },
            strength: {
                name: 'Strength', symbol: '🦁', tone: 1,
                love: 'Sabır ve kibarlık zorlamadan daha çok işe yarar.',
                money: 'Sakinve tutarlı adımlar riskli hareketlerin üstesinden gelir.',
                education: 'Sakin ama ısrarlı olmak zoru başarmanı sağlar.',
                career: 'İnsanlara sabretmen ilerlemeni sağlar, insanlar konuşur sen ilerle.',
                general: 'Cesaret kazandırıcı güçtür.',
                reversed: 'Kendinden şüphe ediyorsun ve modun düşük. Zorlamadan önce dinlen.'
            },
            wheel: {
                name: 'Wheel of Fortune', symbol: '🎡', tone: 1,
                love: 'Önünde memeler açılacak',
                money: 'Para sana akıyor',
                education: 'Planlamadığın bir fırsat karşına çıkacak',
                career: 'Bir dönüm noktası geliyor. Hazır ol.',
                general: 'Bir devran dönüyor, değişim zorla değil olması gerekiyorsa olur.',
                reversed: 'İstediğin şeye geç ulaşmış olabilirsin, bu normaldir. Zaman senin zamanın.'
            },
            death: {
                name: 'Death', symbol: '🦋', tone: 0,
                love: 'Daha doğru olan bir örüntü karşına çıkacak',
                money: 'Parayla ilgilenmendeki eski yol bitecek yeni metodlar doğacak.',
                education: 'Bir sayfa bitiyor yeni bir sayfaya başlıyorsun.',
                career: 'Can sıkıcı süreçler sona erecek refaha ulaşacaksın.',
                general: 'Biten şeyin gitmesine izin ver çünkü karşında yeni doğan fırsatlar seni bekliyor.',
                reversed: 'Bir şey olmadıysa zamanı değilmiştir. Yeni doğacak fırsatlara bak'
            },
            temperance: {
                name: 'Temperance', symbol: '🌊', tone: 0,
                love: 'Partnerinle birbirinizi dengeliyorsunuz',
                money: 'Denge seni korur, ekstrem harcamalardan uzak dur.',
                education: 'Göt deliğine creampie yapmak isteyenlerin niyetini sorgula.',
                career: 'Teorilerle kafayı kırıp pratikten uzaklaşan insanların kafasını kır.',
                general: 'Denge önemli altın oran önemli dengeyi bozmayalım.',
                reversed: 'Dengesizlik var. Aldığın kadarını ver.'
            },
            tower: {
                name: 'The Tower', symbol: '⚡', tone: -1,
                love: 'Rapunzel sarkıt saçlarını',
                money: 'Beklemediğin bir harcama yapabilirsin ama az miktarda.',
                education: 'Planların daha da netleşecek.',
                career: 'Yeni kuleler fethedeceksin.',
                general: 'Her şey çok hızlı değişiyor ama değişim baştan inşaya işaret eder.',
                reversed: 'Değişimin geldiğini görüyorsun ama karşı çıkıyorsun.'
            },
            star: {
                name: 'The Star', symbol: '⭐', tone: 1,
                love: 'Umut ve yenilik. Devam et çünkü güzel şeyler çabanla olacak.',
                money: 'İyileşme ve umut. İstikrarlı hayal hakikattir',
                education: 'Inspiration and guidance. Your efforts are heading somewhere good.',
                career: 'Your talents are recognized, and the long-term outlook is bright.',
                general: 'Hope and renewal. Keep going, because things are improving.',
                reversed: 'Lost faith. Do not let a short rough patch convince you otherwise.'
            },
            moon: {
                name: 'The Moon', symbol: '🌙', tone: -1,
                love: 'Mixed feelings or unspoken things. Ask directly instead of guessing.',
                money: 'Unclear details. Read the fine print before committing.',
                education: 'Uncertainty about the details. Gather more information before deciding.',
                career: 'Things are not as clear as they look. Do not rely on rumors.',
                general: 'Things are unclear, and instinct helps more than assumptions. Wait for the full picture.',
                reversed: 'Confusion lifting. The truth is becoming visible.'
            },
            sun: {
                name: 'The Sun', symbol: '☀️', tone: 1,
                love: 'Warmth, joy and openness. A happy connection.',
                money: 'Success and stability. Effort pays off.',
                education: 'Success and clarity. Your effort shows.',
                career: 'Recognition and success. Your hard work is seen.',
                general: 'Joy, clarity and success. This looks good.',
                reversed: 'Good things are on the way but delayed. Keep expectations realistic.'
            }
        };

        // ===== PART 3: SPREAD POSITIONS =====
        const POSITIONS = [
            { label: 'The situation', frame: 'Sorunun kalbi: ' },
            { label: 'The obstacle',  frame: 'Yolunda duran şey: ' },
            { label: 'The outcome',   frame: 'Gittiğin yön: ' }
        ];

        // ===== PART 4: EXTRA LINES =====
        const OPENINGS = {
            yes:     ['Kartlar evet diyor.', 'Kartlar senden yana.'],
            no:      ['Şimdilik kartlar net bir şey söyleyemiyor.', 'Kartlar dikkatli olmanı tavsiye ediyor.'],
            unclear: ['Kartlar kararsız, bu yüzden sonuç senin ellerinde.', 'Cevap henüz kesinleşmemiş, seçeneklerin kesinleştirecek.']
        };
        const TIMING = [
            'As for timing, not tomorrow, but sooner than you fear.',
            'As for timing, within a season, once you stop watching the clock.',
            'As for timing, when you have stopped waiting for permission.'
        ];
        const BARNUM = [
            'İçinde kimseye söyleyemediğin bir şeyler var.',
            'Kendinin üzerine diğer insanlardan daha fazla geliyorsun.',
            'İlgi istiyorsun ama bağımsızlık da istiyorsun.',
            'Henüz sergilemediğin gizli güçlerin var.',
            'Bazen bazı kararlarından şüphe ediyorsun ama verdiğin kararlar doğru.'
        ];
        const CLOSINGS = [
            'Kendine kartlardan daha çok güven',
            'Sen çok seksisin.',
            'Kartlar yön gösterir adımları sen seçersin.',
            'Hardcore sex hardcore sex.'
        ];

        // ===== PART 5: THE ENGINE (no need to edit below) =====
        const YESNO_STARTERS = ['will', 'should', 'can', 'could', 'do', 'does', 'did', 'is', 'am', 'are', 'shall', 'would', 'has', 'have'];

                function normalize(q) {
            return q.toLocaleLowerCase('tr-TR')
                    .replace(/[^\p{L}\p{N}\s']/gu, ' ')
                    .replace(/\s+/g, ' ').trim();
        }

        function detectTopic(q) {
            const padded = ' ' + q + ' ';
            let best = 'general', bestScore = 0;
            for (const topic in TOPICS) {
                const score = TOPICS[topic].filter(w => {
                    w = w.toLocaleLowerCase('tr-TR');
                    return padded.includes(' ' + w + (w.length <= 3 ? ' ' : ''));
                }).length;
                if (score > bestScore) { best = topic; bestScore = score; }
            }
            return best;
        }

        const TR_QUESTION = ['mi','mı','mu','mü','miyim','mıyım','muyum','müyüm',
                             'miyiz','mıyız','muyuz','müyüz','misin','mısın','musun','müsün'];

        function isYesNo(q) {
            const words = q.split(' ');
            return YESNO_STARTERS.includes(words[0]) || words.some(w => TR_QUESTION.includes(w));
        }
        function isTiming(q) {
            return q.split(' ')[0] === 'when' || q.includes('how long') || q.includes('how soon')
                || q.includes('ne zaman') || q.includes('ne kadar');
        }

        // Same question on the same day gives the same reading.
        function hash(str) {
            let h = 1779033703 ^ str.length;
            for (let i = 0; i < str.length; i++) {
                h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
                h = (h << 13) | (h >>> 19);
            }
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h ^ (h >>> 16)) >>> 0;
        }

        // Same question on the same day gives the same reading.
        function hash(str) {
            let h = 1779033703 ^ str.length;
            for (let i = 0; i < str.length; i++) {
                h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
                h = (h << 13) | (h >>> 19);
            }
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h ^ (h >>> 16)) >>> 0;
        }
        function makeRng(seed) {
            return function () {
                seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
                let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        const pickFrom = (list, rng) => list[Math.floor(rng() * list.length)];

        function drawCards(rng) {
            const keys = Object.keys(CARDS);
            for (let i = keys.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [keys[i], keys[j]] = [keys[j], keys[i]];
            }
            return keys.slice(0, 3).map(key => ({ key, reversed: rng() < 0.35 }));
        }

        function yesNoLean(drawn) {
            let score = 0;
            drawn.forEach((d, i) => {
                const tone = CARDS[d.key].tone * (d.reversed ? -1 : 1);
                score += tone * (i === 2 ? 2 : 1);
            });
            return score > 1 ? 'yes' : score < -1 ? 'no' : 'unclear';
        }

        function el(tag, className, text) {
            const e = document.createElement(tag);
            if (className) e.className = className;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function buildReading(rawQuestion) {
            const q = normalize(rawQuestion);
            const today = new Date().toISOString().slice(0, 10);
            const rng = makeRng(hash(q + '|' + today));

            const topic = detectTopic(q);
            const yesNo = isYesNo(q);
            const drawn = drawCards(rng);

            const wrap = document.createDocumentFragment();

            // Opening line
            let opening;
            if (yesNo) opening = pickFrom(OPENINGS[yesNoLean(drawn)], rng);
            else opening = 'On ' + TOPIC_NAMES[topic] + ', the cards say:';
            if (isTiming(q)) opening += ' ' + pickFrom(TIMING, rng);
            wrap.appendChild(el('p', 'opening', opening));

            // Spread
            const spread = el('div', 'spread');
            const slots = [];
            drawn.forEach((d, i) => {
                const card = CARDS[d.key];
                const text = d.reversed ? card.reversed : (card[topic] || card.general);

                const slot = el('div', 'slot');
                slot.appendChild(el('div', 'position', POSITIONS[i].label));
                const tcard = el('div', 'tcard' + (d.reversed ? ' reversed' : ''));
                tcard.append(el('div', 'symbol', card.symbol), el('div', 'cname', card.name), el('div', 'rev', d.reversed ? '(reversed)' : ''));
                slot.appendChild(tcard);
                slot.appendChild(el('p', '', POSITIONS[i].frame + text));
                spread.appendChild(slot);
                slots.push(slot);
            });
            wrap.appendChild(spread);

            // Ending
            const ending = el('div', 'ending');
            ending.appendChild(el('p', '', pickFrom(BARNUM, rng)));
            ending.appendChild(el('p', 'closing', pickFrom(CLOSINGS, rng)));
            wrap.appendChild(ending);

            return { wrap, slots, ending };
        }

        const form = document.getElementById('askForm');
        const input = document.getElementById('question');
        const reading = document.getElementById('reading');
        const status = document.getElementById('status');
        const againBtn = document.getElementById('againBtn');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let timers = [];

        function clearTimers() { timers.forEach(clearTimeout); timers = []; }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const question = input.value.trim();
            if (!question) { status.textContent = 'Type a question first.'; return; }
            status.textContent = '';
            clearTimers();
            reading.replaceChildren();

            const { wrap, slots, ending } = buildReading(question);
            reading.appendChild(wrap);
            againBtn.hidden = false;

            const step = reduceMotion ? 0 : 900;
            slots.forEach((slot, i) => {
                timers.push(setTimeout(() => slot.classList.add('show'), 300 + i * step));
            });
            timers.push(setTimeout(() => ending.classList.add('show'), 300 + slots.length * step));
        });

        againBtn.addEventListener('click', function () {
            clearTimers();
            reading.replaceChildren();
            input.value = '';
            againBtn.hidden = true;
            input.focus();
        });
    </script>
</body>
</html>
